baseURL = "https://vari.sh/"
languageCode = "en"
title = "vari.sh"
theme = "cremisi"

[markup]
  [markup.highlight]
    # Colours come from the theme's own css/syntax.css (class-based output).
    style = "monokai"
    lineNos = false
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  description = "Field notes from the other side of the EDR: Windows internals, syscalls, and the dark craft of red teaming."
  authorRole = "Red Teamer & Offensive Security Researcher"
  heroEyebrow  = "Enter the Grimoire"
  heroTitle    = "Exploits, Rituals<br><em>&amp; Red Team Craft</em>"
  heroSubtitle = "Windows internals, EDR evasion, and the dark craft of red teaming — written down as field notes for fellow sorcerers of the offensive arts."

  github = "https://github.com/vari-sh"

  toc             = true
  search          = false
  syntaxHighlight = true

  [params.author]
    name = "vari.sh"

[menu]
  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "Posts"
    url    = "/posts/"
    weight = 2
  [[menu.main]]
    name   = "Tags"
    url    = "/tags/"
    weight = 3
  [[menu.main]]
    name   = "About"
    url    = "/#about"
    weight = 4

[taxonomies]
  tag      = "tags"
  category = "categories"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
