{{ define "main" }}
<div class="container">

  <header class="page-header">
    <p class="page-eyebrow label">The Index</p>
    <h1 class="page-title">Tags</h1>
    <p class="page-subtitle">Every topic inscribed in this grimoire, by weight.</p>
    <div class="rule-double" aria-hidden="true"></div>
  </header>

  <div class="tags-cloud">
    {{ $colors := slice "blood-500" "ember" "gold" "sage" "teal" "rose" "clay" "blood-700" }}
    {{ range $i, $term := .Data.Terms.Alphabetical }}
    <a href="{{ .Page.Permalink }}" class="tag-item"
       style="--tag-color: var(--{{ index $colors (mod $i (len $colors)) }})">
      {{ .Page.Title }}
      <span class="tag-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>

</div>
{{ end }}
